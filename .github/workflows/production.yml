name: Production deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bookmate-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run tests
        run: ./gradlew --no-daemon clean test

  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_sha: ${{ steps.image.outputs.image_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare image names
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_sha=$image:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image_sha }}
            ghcr.io/${{ github.repository }}:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy production
    runs-on:
      - self-hosted
      - bookmate-staging
    needs: build-image
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write production env file
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          if [ -z "$PRODUCTION_ENV_FILE" ]; then
            echo "::error::Missing production environment secret: PRODUCTION_ENV_FILE"
            exit 1
          fi
          umask 077
          printf '%s' "$PRODUCTION_ENV_FILE" > .env.production

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy API container
        env:
          API_IMAGE: ${{ needs.build-image.outputs.image_sha }}
          USE_TRAEFIK: auto
        run: ./scripts/deploy-production.sh
