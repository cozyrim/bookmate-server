spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookmate}
    username: ${DB_USERNAME:bookmate}
    password: ${DB_PASSWORD:bookmate}

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  address: ${SERVER_ADDRESS:0.0.0.0}

auth:
  jwt:
    secret: ${JWT_SECRET:bookmate-local-development-secret-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:1209600}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /docs
    operations-sorter: method
    tags-sorter: alpha

app:
  public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:8080}
  apple:
    client-id: ${APPLE_CLIENT_ID:cozyrim.BookMate-mini}
  discord:
    login-webhook-url: ${DISCORD_LOGIN_WEBHOOK_URL:}
  moderation:
    admin-secret: ${MODERATION_ADMIN_SECRET:}
  upload:
    profile-image-dir: ${PROFILE_IMAGE_UPLOAD_DIR:uploads/profile-images}
  r2:
    enabled: ${R2_ENABLED:false}
    endpoint: ${R2_ENDPOINT:}
    region: ${R2_REGION:auto}
    bucket: ${R2_BUCKET:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
  fcm:
    enabled: ${FCM_ENABLED:false}
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
